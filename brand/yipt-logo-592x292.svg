<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 292" width="592" height="292">
  <defs>
    <clipPath id="box-clip">
      <rect width="592" height="292"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="592" height="292" fill="#f5f0e8"/>

  <!-- Corner triangle -->
  <polygon points="592,222 592,292 522,292" fill="#FF6B00" clip-path="url(#box-clip)"/>

  <!-- Horizontal rules -->
  <rect x="52" y="108" width="488" height="2" fill="rgba(0,0,0,0.08)"/>
  <rect x="52" y="192" width="488" height="2" fill="rgba(0,0,0,0.08)"/>

  <!-- YEAH, -->
  <text x="52" y="98" font-family="'Black Han Sans', sans-serif" font-size="62" letter-spacing="-1" fill="#1a1a1a">YEAH,</text>

  <!-- I'D (solid orange) -->
  <text x="52" y="184" font-family="'Black Han Sans', sans-serif" font-size="62" letter-spacing="-1" fill="#FF6B00">I'D</text>

  <!-- PRINT (outline) -->
  <text x="158" y="184" font-family="'Black Han Sans', sans-serif" font-size="62" letter-spacing="-1" fill="none" stroke="#1a1a1a" stroke-width="2.5">PRINT</text>

  <!-- THAT. -->
  <text x="52" y="268" font-family="'Black Han Sans', sans-serif" font-size="62" letter-spacing="-1" fill="#FFB800" stroke="#1a1a1a" stroke-width="2" paint-order="stroke">THAT.</text>

  <!-- Tagline -->
  <text x="52" y="285" font-family="'Oswald', sans-serif" font-size="11" letter-spacing="3.5" fill="#999" font-weight="400">3D PRINTING FOR EVERYONE</text>
</svg>
